; Line Follower Robot - Arduino Nano (ATmega328P)
;
; Main firmware:  pio run -e nano_old -t upload        (or nano_new)
; Sensor test:    pio run -e sensor_test_old -t upload (or sensor_test_new)
; Simple reader:  pio run -e simple_old -t upload      (or simple_new)
; Wheel test:     pio run -e wheel_test_old -t upload  (or wheel_test_new)
; Monitor:        pio device monitor
;
; "_old" = 57600 baud bootloader, "_new" = 115200 baud bootloader.
; If upload says "not in sync", use the other one.
; ATmega328PB chip: use the pb_* environments at the bottom.

[platformio]
default_envs = nano_old

[env]
platform = atmelavr
framework = arduino
monitor_speed = 115200
build_flags = -O2 -Wall
build_src_filter = +<main.cpp>

[env:nano_old]
board = nanoatmega328

[env:nano_new]
board = nanoatmega328new

[env:sensor_test_old]
board = nanoatmega328
build_src_filter = +<sensor_test.cpp>

[env:sensor_test_new]
board = nanoatmega328new
build_src_filter = +<sensor_test.cpp>

; ---------- ATmega328PB Nano clones ----------
; Try the 115200 pair first, then the 57600 pair.
[pb]
board = ATmega328PB
board_build.f_cpu = 16000000L
upload_protocol = arduino

[env:pb_115200]
extends = pb
upload_speed = 115200

[env:pb_57600]
extends = pb
upload_speed = 57600

[env:sensor_test_pb_115200]
extends = pb
upload_speed = 115200
build_src_filter = +<sensor_test.cpp>

[env:sensor_test_pb_57600]
extends = pb
upload_speed = 57600
build_src_filter = +<sensor_test.cpp>

[env:simple_old]
board = nanoatmega328
build_src_filter = +<simple_sensors.cpp>

[env:simple_new]
board = nanoatmega328new
build_src_filter = +<simple_sensors.cpp>

[env:wheel_test_old]
board = nanoatmega328
build_src_filter = +<wheel_test.cpp>

[env:wheel_test_new]
board = nanoatmega328new
build_src_filter = +<wheel_test.cpp>

[env:calibrate_new]
board = nanoatmega328new
build_src_filter = +<calibrate.cpp>

[env:calibrate_old]
board = nanoatmega328
build_src_filter = +<calibrate.cpp>